apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: job-seekr
spec:
  type: ClusterIP
  selector:
    app: rabbitmq
  ports:
    - name: rabbitmq
      port: 5672
      targetPort: 5672

---

apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-management
  namespace: job-seekr
spec:
  type: NodePort
  selector:
    app: rabbitmq
  ports:
    - name: management
      port: 15672
      targetPort: 15672
      nodePort: 300072

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: job-seekr
data:
  rabbitmq.conf: |
    consumer_timeout = 900000

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: job-seekr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4-management
          ports:
            - name: amqp
              containerPort: 5672
            - name: web-management
              containerPort: 15672
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
              subPath: rabbitmq
            - name: rabbitmq-config
              mountPath: /etc/rabbitmq/rabbitmq.conf
              subPath: rabbitmq.conf

      volumes:
        - name: rabbitmq-data
          persistentVolumeClaim:
            claimName: job-seekr-pvc
        - name: rabbitmq-config
          configMap:
            name: rabbitmq-config





