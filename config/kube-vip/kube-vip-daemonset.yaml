apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-vip
  namespace: kube-system

spec:
  selector:
    matchLabels:
      app: kube-vip

  template:
    metadata:
      labels:
        app: kube-vip

    spec:
      hostNetwork: true
      serviceAccountName: kube-vip

      containers:
        - name: kube-vip
          image: ghcr.io/kube-vip/kube-vip:v0.8.0

          args:
            - manager


          env:
            - name: vip_interface
              value: enxc84d442913dc

            - name: address
              value: 10.0.1.200

            - name: port
              value: "6443"

            - name: vip_arp
              value: "true"

            - name: cp_enable
              value: "true"

            - name: cp_namespace
              value: kube-system

            - name: svc_enable
              value: "true"

            - name: vip_leaderelection
              value: "true"

            - name: vip_leasename
              value: plndr-cp-lock

            - name: svc_leasename
              value: plndr-svcs-lock

            - name: vip_leaseduration
              value: "5"

            - name: vip_renewdeadline
              value: "3"

            - name: vip_retryperiod
              value: "1"

            - name: vip_nodename
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName































          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
