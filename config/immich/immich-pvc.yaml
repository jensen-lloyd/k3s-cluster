apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-pv

spec:
  capacity:
    storage: 750Gi

  accessModes:
    - ReadWriteMany

  storageClassName: manual

  persistentVolumeReclaimPolicy: Retain

  nfs:
    server: 10.0.1.200
    path: /primaryPool/apps/immich


---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-pvc
  namespace: immich

spec:
  storageClassName: manual

  accessModes:
    - ReadWriteMany

  resources:
    requests:
      storage: 750Gi

  volumeName: immich-pv
