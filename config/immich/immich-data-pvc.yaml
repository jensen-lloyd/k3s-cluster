apiVersion: v1
kind: PersistentVolume
metadata:
  name: joplin-pv

spec:
  capacity:
    storage: 2Gi

  accessModes:
    - ReadWriteMany

  storageClassName: manual

  persistentVolumeReclaimPolicy: Retain

  nfs:
    server: 10.0.1.200
    path: /primaryPool/apps/joplin


---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: joplin-pvc
  namespace: joplin

spec:
  storageClassName: manual

  accessModes:
    - ReadWriteMany

  resources:
    requests:
      storage: 2Gi

  volumeName: joplin-pv
