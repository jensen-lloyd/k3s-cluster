apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich
  namespace: immich
  annotations:
    spec.ingressClassName: traefik

    # force HTTP backend (important for Immich + Traefik)
    # traefik.ingress.kubernetes.io/service.serversscheme: http

    # ensure correct entrypoint (TLS via Traefik)
    # traefik.ingress.kubernetes.io/router.entrypoints: websecure

spec:
  rules:
    - host: immich.colins.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: immich-server
                port:
                  number: 2283

  tls:
    - hosts:
        - immich.colins.io
