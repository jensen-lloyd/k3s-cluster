apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0

          securityContext:
            runAsUser: 999
            runAsGroup: 999
            appArmorProfile:
              type: Unconfined


          env:
            - name: POSTGRES_DB
              value: immich
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres


          volumeMounts:
            - name: immich-storage
              mountPath: /var/lib/postgresql/data
              subPath: postgres

      volumes:
        - name: immich-storage
          persistentVolumeClaim:
            claimName: immich-pvc

---

apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: immich
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
